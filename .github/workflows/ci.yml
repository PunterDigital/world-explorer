name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, unit tests, assemble
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: world-explorer-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  e2e:
    name: E2E (emulator, API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebugAndroidTest

      - name: Instrumented tests + packaged release smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # emulator-runner runs each script line on its own, so the failure
          # diagnostics (focused window, crashes/ANRs, a screenshot in the
          # uploaded reports) have to stay on one line.
          # A cold-booted emulator's launcher sometimes ANRs and its dialog
          # steals focus from the app under test (Espresso then fails with
          # RootViewWithoutFocusException). Hide error dialogs and restart the
          # launcher to clear any that is already up.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb shell input keyevent KEYCODE_HOME
            ./gradlew connectedDebugAndroidTest || { mkdir -p app/build/reports/androidTests; adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp'; adb logcat -d | grep -E 'FATAL|ANR in|AndroidRuntime|not responding' | tail -60; adb exec-out screencap -p > app/build/reports/androidTests/failure.png; exit 1; }
            bash scripts/smoke-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
